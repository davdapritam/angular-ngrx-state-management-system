<mat-card class="user-card">
    <mat-card-title>{{this.post.title}}</mat-card-title>
    <mat-card-content>{{this.post.description}}</mat-card-content>
    <div class="btns">
        <button mat-raised-button color="warn" (click)="delete()">Delete</button>
        <button mat-raised-button color="primary" (click)="update()">Update</button>
    </div>
</mat-card>
